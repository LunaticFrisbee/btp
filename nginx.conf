user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Log Settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # DDoS Protection Settings
    
    # Client body size and buffer limitations
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 10m;
    large_client_header_buffers 2 1k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Rate limiting zone definitions
    # Limit requests per IP address
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
    
    # Limit connections per IP address
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    
    # Limit requests per server
    limit_req_zone $server_name zone=req_limit_per_server:10m rate=200r/s;
    
    # Virtual Host Configs
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name example.com www.example.com;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/example.com.crt;
        ssl_certificate_key /etc/nginx/ssl/example.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # HSTS (optional - uncomment if needed)
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
        
        # Apply DDoS protection rules
        
        # Connection limits
        limit_conn conn_limit_per_ip 20;
        limit_conn_status 429;
        
        # Request rate limits with burst allowance
        limit_req zone=req_limit_per_ip burst=20 nodelay;
        limit_req zone=req_limit_per_server burst=100;
        limit_req_status 429;
        
        # Slow down consecutive requests from the same client
        limit_rate 1000k;
        
        # Block unusual HTTP methods
        if ($request_method !~ ^(GET|POST|HEAD)$) {
            return 444;
        }
        
        # Block requests with no User-Agent header (common in DDoS attacks)
        if ($http_user_agent = "") {
            return 403;
        }
        
        # Block requests with suspicious query strings
        if ($query_string ~* "union.*select|concat|eval\(|base64") {
            return 403;
        }
        
        # Block excessive connections to wp-login.php (adjust path as needed)
        location = /wp-login.php {
            limit_req zone=req_limit_per_ip burst=2;
            include /etc/nginx/proxy_params;
            proxy_pass http://backend;
        }
        
        # Location blocks for your application
        location / {
            try_files $uri $uri/ /index.html;
            
            # Extra security headers
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            add_header X-XSS-Protection "1; mode=block";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';";
            
            # Proxy to backend application
            include /etc/nginx/proxy_params;
            proxy_pass http://backend;
        }
        
        # Static files location with longer cache time
        location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
        
        # Deny access to hidden files
        location ~ /\. {
            deny all;
            return 404;
        }
    }
    
    # Backend servers
    upstream backend {
        # Use IP Hash to maintain session persistence
        ip_hash;
        
        # List your backend servers here
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8081 max_fails=3 fail_timeout=30s backup;
        
        # Adjust these settings based on your server capacity
        keepalive 32;
    }
    
    
    # Include any additional configuration files
    include /etc/nginx/conf.d/*.conf;
}